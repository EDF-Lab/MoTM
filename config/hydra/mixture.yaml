run:
  dir: outputs/mixture/${subdir_name}

job_logging:
  version: 1
  formatters:
    simple:
      format: '%(asctime)s %(levelname)s - %(message)s'
      datefmt: '%d-%m-%Y %H:%M:%S'
  handlers:
    console:
      class: logging.StreamHandler
      formatter: simple
      stream: ext://sys.stdout
  root:
    handlers: [file]

  disable_existing_loggers: false