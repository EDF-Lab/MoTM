run:
  dir: outputs/${trainer.name}/${data.name}/inr_z${inr.latent_dim}_freq${inr.num_frequencies}_${inr.depth}x${inr.width}_ep${trainer.max_epochs}
sweep:
  dir: outputs/${task.name}/${data.importation.train_file}/${now:%Y-%m-%d_%H-%M-%S}
  subdir: ${hydra.job.num}

job_logging:
  version: 1
  formatters:
    simple:
      format: '%(asctime)s %(levelname)s - %(message)s'
      datefmt: '%d-%m-%Y %H:%M:%S'
  handlers:
    console:
      class: logging.StreamHandler
      formatter: simple
      stream: ext://sys.stdout
    file:
      class : logging.handlers.RotatingFileHandler
      formatter: simple
      filename: ${hydra.runtime.output_dir}/infos.log
  root:
    handlers: [file]

  disable_existing_loggers: false